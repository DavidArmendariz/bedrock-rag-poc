[project]
name = "bedrock-rag-poc"
version = "0.1.0"
description = "Default template for PDM package"
authors = [{ name = "David Armendariz", email = "david.adrian.a.p@gmail.com" }]
dependencies = [
  "alembic>=1.15.1",
  "python-dotenv>=1.0.1",
  "fastapi>=0.115.11",
  "uvicorn>=0.34.0",
  "boto3>=1.37.15",
  "sqlalchemy>=2.0.39",
  "psycopg[binary,pool]>=3.2.6",
]
requires-python = "==3.12.*"
readme = "README.md"
license = { text = "MIT" }


[tool.pdm]
distribution = false

[tool.mypy]
plugins = ["sqlmypy"]

[tool.pdm.scripts]
start = "uvicorn src.main:app --reload"
check_types = "mypy src"

[dependency-groups]
dev = ["mypy>=1.15.0", "sqlalchemy-stubs>=0.4"]
